name: Dev 构建（pre-release）

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 dev 分支
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 构建 APK（debug 签名，便于直接覆盖安装）
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: 重命名产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/Inko-dev-${{ github.run_number }}.apk"
          ls -lh dist

      - name: 发布 pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Inko dev #${{ github.run_number }}"
          prerelease: true
          files: dist/Inko-dev-${{ github.run_number }}.apk
          body: |
            Inko 开发版构建 · dev 分支

            提交：${{ github.sha }}
            版本号：`${{ github.run_number }}`

            使用 debug 签名，可直接覆盖安装；这是预发布产物，功能仍在调整。
