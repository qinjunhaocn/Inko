name: 主分支发布（release）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main 分支
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 构建 APK
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: 重命名产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/Inko-${{ github.run_number }}.apk"
          ls -lh dist

      - name: 创建正式 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Inko v${{ github.run_number }}
          prerelease: false
          files: dist/Inko-${{ github.run_number }}.apk
          body: |
            Inko 正式版构建 · main 分支

            提交：${{ github.sha }}
            版本号：`${{ github.run_number }}`
